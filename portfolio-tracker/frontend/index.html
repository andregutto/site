<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline (not the async index.css bundle) so it paints on the very first frame —
         kills the white flash between HTML parse and the CSS file finishing download,
         which is the second half of the "branco e cinza" flash reported on PWA cold
         start (the first half, before any HTML exists, is the OS-level splash — see
         apple-touch-startup-image, not fixable from CSS). Mirrors index.css's own
         html{#0D0D0D}/body{--arvo-offwhite} rule so there's no visible handoff once
         the real stylesheet loads. -->
    <style>html{background-color:#0D0D0D}body{background-color:#FAF8F4;margin:0}</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Static launch-screen images for the iOS "Add to Home Screen" PWA — Safari's
         auto-generated splash from the manifest (background_color/icons) is unreliable,
         so it was falling back to a plain system gray placeholder before any HTML/CSS
         loads. One PNG per current iPhone screen size (#0D0D0D bg + gold symbol
         centered), generated from brand/logo/arvo-symbol-gold.svg. Portrait only,
         matching manifest.json's orientation. -->
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1260x2736.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/brand/splash/splash-640x1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/brand/splash/splash-750x1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/brand/splash/splash-828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash/splash-1320x2868.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="arvo" />
    <title>arvo — Cultive o que é seu</title>
    <meta name="description" content="Consolide seus investimentos no Brasil e na Europa, controle gastos e converse com seu portfólio — tudo num só lugar." />

    <meta name="twitter:description" content="Seu patrimônio no Brasil e na Europa, finalmente num só lugar." />
    <meta name="twitter:image" content="/brand/og-cover.jpg" />
  </head>
