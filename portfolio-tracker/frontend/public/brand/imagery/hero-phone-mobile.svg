    <rect x="27" y="338" width="224" height="40" rx="10" fill="#fff" stroke="rgba(13,13,13,0.06)"/>
    <rect x="39" y="354" width="6" height="10" rx="2" fill="#1B4FD8"/>
    <rect x="55" y="354" width="120" height="10" rx="5" fill="rgba(27,79,216,0.12)"/>
