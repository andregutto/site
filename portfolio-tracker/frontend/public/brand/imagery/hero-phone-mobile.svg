<svg width="260" height="520" viewBox="0 0 260 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <clipPath id="hpm-screen"><rect x="9" y="9" width="242" height="502" rx="41"/></clipPath>
    <linearGradient id="hpm-chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8B89A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C8B89A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="260" height="520" rx="50" fill="#1C1C1E"/>

  <g clip-path="url(#hpm-screen)">
