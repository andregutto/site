    <path d="M39,310 C 80,308 110,300 140,280 C 175,256 210,236 239,228 L 239,316 L 39,316 Z" fill="url(#hpm-chart)"/>
    <path d="M39,310 C 80,308 110,300 140,280 C 175,256 210,236 239,228" fill="none" stroke="#C8B89A" stroke-width="2"/>

