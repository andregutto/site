    <!-- nav bar -->
    <rect x="9" y="9" width="242" height="48" fill="#fff"/>
    <line x1="9" y1="57" x2="251" y2="57" stroke="rgba(13,13,13,0.07)"/>
    <text x="48" y="38" font-family="'Tenor Sans', Georgia, serif" font-size="13" letter-spacing="3" fill="#0D0D0D">arvo</text>
    <circle cx="230" cy="33" r="14" fill="#0D0D0D"/>
    <text x="230" y="36.5" font-family="'DM Sans', sans-serif" font-size="9" letter-spacing="0.5" fill="#C8B89A" text-anchor="middle">AG</text>

    <!-- title -->
    <text x="27" y="84" font-family="'DM Sans', sans-serif" font-size="8" letter-spacing="2" fill="rgba(13,13,13,0.45)">SIMULAÇÃO</text>
    <text x="27" y="106" font-family="'Tenor Sans', Georgia, serif" font-size="18" fill="#0D0D0D">Liberdade Financeira</text>

