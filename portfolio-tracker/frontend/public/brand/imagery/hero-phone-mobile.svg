    <rect x="27" y="122" width="224" height="84" rx="12" fill="#fff" stroke="rgba(27,79,216,0.18)"/>
    <text x="39" y="142" font-family="'DM Sans', sans-serif" font-size="8" letter-spacing="2" fill="rgba(13,13,13,0.42)">META</text>
    <text x="39" y="167" font-family="'Tenor Sans', Georgia, serif" font-size="22" fill="#1B4FD8">2041</text>
