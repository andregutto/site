    <rect x="39" y="450" width="6" height="10" rx="2" fill="#C8B89A"/>
    <rect x="55" y="450" width="120" height="10" rx="5" fill="rgba(200,184,154,0.20)"/>
    <rect x="55" y="450" width="40" height="10" rx="5" fill="#C8B89A"/>
