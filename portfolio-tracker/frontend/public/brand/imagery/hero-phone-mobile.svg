    <text x="239" y="142" font-family="'DM Sans', sans-serif" font-size="8" letter-spacing="2" fill="rgba(13,13,13,0.42)" text-anchor="end">PATRIMÔNIO ALVO</text>
    <text x="239" y="167" font-family="'Tenor Sans', Georgia, serif" font-size="17" fill="#0D0D0D" text-anchor="end">R$ 4,2M</text>
    <text x="239" y="185" font-family="'DM Sans', sans-serif" font-size="9" fill="rgba(13,13,13,0.50)" text-anchor="end">regra de 4%</text>
    <rect x="39" y="194" width="200" height="4" rx="2" fill="rgba(27,79,216,0.10)"/>
    <rect x="39" y="194" width="16" height="4" rx="2" fill="#1B4FD8"/>

